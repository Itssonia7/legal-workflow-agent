<div class="bg-white/10 backdrop-blur-xl border border-white/15 rounded-3xl shadow-2xl flex flex-col h-full overflow-hidden">

  <!-- Header -->
  <div class="px-6 py-4 border-b border-white/10 flex items-center gap-3 shrink-0">
    <div class="relative">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
      </svg>
      <span class="absolute -bottom-0.5 -right-0.5 h-2.5 w-2.5 rounded-full bg-emerald-400 border-2 border-slate-900"></span>
    </div>
    <div>
      <h3 class="text-sm font-bold text-white">Legal Assistant</h3>
      <p class="text-[11px] text-indigo-300">Ask about the system</p>
    </div>
  </div>

  <!-- Messages Area -->
  <div #scrollArea class="flex-1 overflow-y-auto px-5 py-4 space-y-3 scrollbar-thin">
    @for (msg of messages(); track $index) {
      <div [class]="msg.role === 'user' ? 'flex justify-end' : 'flex justify-start'">
        <div [class]="msg.role === 'user'
          ? 'bg-indigo-600/80 text-white rounded-2xl rounded-br-md px-4 py-2.5 max-w-[85%] text-sm'
          : 'bg-white/10 text-indigo-100 rounded-2xl rounded-bl-md px-4 py-2.5 max-w-[85%] text-sm border border-white/5'">
          {{ msg.text }}
        </div>
      </div>
    }
  </div>

  <!-- Input Row -->
  <div class="px-4 py-3 border-t border-white/10 flex items-center gap-2 shrink-0">
    <input
      type="text"
      autocomplete="off"
      [value]="inputValue"
      (input)="inputValue = $any($event.target).value"
      (keydown)="onKeydown($event)"
      class="flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-white text-sm placeholder-gray-400 focus:outline-none focus:border-indigo-400 focus:bg-white/10 transition"
      placeholder="Type a message…" />
    <button
      (click)="send()"
      class="bg-indigo-600 hover:bg-indigo-500 text-white p-2.5 rounded-xl shadow-lg shadow-indigo-600/20 transition duration-300 shrink-0">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
      </svg>
    </button>
  </div>

</div>
